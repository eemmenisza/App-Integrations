# Daily pull: Monday Parties CRM + People Pool → CRM manifest (+ snapshot artifacts)
name: qaas-monday-daily

on:
  schedule:
    # 02:00 UTC ≈ 04:00 Africa/Johannesburg
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qaas-monday-daily
  cancel-in-progress: true

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull Monday → snapshots + manifest
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_PARTIES_BOARD_ID: ${{ vars.MONDAY_PARTIES_BOARD_ID }}
          MONDAY_PEOPLE_POOL_BOARD_ID: ${{ vars.MONDAY_PEOPLE_POOL_BOARD_ID }}
          QAAS_PARTIES_EXPORT_URL: ${{ secrets.QAAS_PARTIES_EXPORT_URL }}
        run: node scripts/sync-qaas-monday.mjs

      - name: Upload PII snapshots (artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: qaas-monday-crm-${{ github.run_id }}
          path: data/crm/snapshots/
          retention-days: 30
          if-no-files-found: error

      - name: Commit safe manifest only
        run: |
          git config user.name "qaas-monday-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crm/manifest.json
          if git diff --staged --quiet; then
            echo "No manifest changes"
          else
            git commit -m "chore(crm): daily Monday Parties + People Pool pull manifest"
            git push
          fi
